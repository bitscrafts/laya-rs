name: release

# Pushing a tag like v0.1.0 builds the binaries and publishes them with their checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: gate before anything is published
        run: cargo xtask gate
      - name: build
        run: cargo build --release --locked -p laya-cli -p laya-mcp
      - name: package
        run: |
          set -eu
          NAME="laya-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$NAME"
          for b in laya laya-mcp laya-gate; do cp "target/release/$b" "dist/$NAME/"; done
          cp LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -l dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
