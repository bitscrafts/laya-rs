[package]
name = "laya-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The generic DAG engine: parse, validate and lower a flow document into its execution form. Laya supplies a value; the graph owns every edge."

[dependencies]
laya-abi = { path = "../laya-abi" }
laya-core = { path = "../laya-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Content-hashes a subflow's definition (R6), so an edited child cannot
# silently change the parent's behaviour. Already a workspace dependency
# (the ledger uses it) — no second hash crate (N5).
blake3 = { workspace = true }
# The scheduler's bounded fan-out (R9) and writer mutual exclusion (R10) run
# on this. The workspace pin is `default-features = false`, so the runtime
# features actually needed are stated explicitly here, as `laya-mcp` already
# does — a bare `workspace = true` gives a tokio that cannot spawn tasks.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[lints]
workspace = true
