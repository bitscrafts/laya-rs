[package]
name = "laya-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The MCP stdio server: one Rust binary exposing laya-rs to Hermes, pi, Claude Code, skills and hooks"

[[bin]]
name = "laya-mcp"
path = "src/main.rs"

[[bin]]
# One command judged, one verdict, one ledger row — for callers that cannot speak MCP,
# such as a shell hook on every state-changing tool call. Registered here rather than in
# laya-cli because the gate rule lives in this crate; a second copy of the rule, in
# another crate, would be two gates that can drift apart.
name = "laya-gate"
path = "src/bin/laya-gate.rs"

[dependencies]
laya-store = { path = "../laya-store" }
laya-abi = { path = "../laya-abi" }
laya-core = { path = "../laya-core" }
laya-backbone = { path = "../laya-backbone" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
rmcp = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
